name: deploy

on:
  push:
    branches:
      - "master"
    paths:
      - "src/**"
      - "static/**"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - "svelte.config.js"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: "1.3.11"

      - run: bun ci

      - name: Check
        run: bun run check

      - name: Build
        env:
          BASE_PATH: "/${{ github.event.repository.name }}" # in this case: blog
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
