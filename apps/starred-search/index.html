<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search your GitHub starred repositories, READMEs included, in the browser"
    />
    <title>Starred Search</title>
    <script>
      // Set the theme before first paint so a dark page never flashes light.
      try {
        const stored = localStorage.getItem("theme");
        const dark = stored
          ? stored === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (_) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
