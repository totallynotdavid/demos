[tools]
bun = "1.4.2"
biome = "2.5.14"
node = "24"

[tasks.lint]
description = "Lint and format-check every app"
run = "bun run --filter '*' lint"

[tasks.typecheck]
description = "Typecheck every app"
run = "bun run --filter '*' typecheck"

[tasks.build]
description = "Build every app"
run = "bun run --filter '*' build"

[tasks.check]
description = "Lint, typecheck and build every app"
depends = ["lint", "typecheck", "build"]

[tasks.fix]
description = "Format and apply safe lint fixes"
run = "biome check --write ."
